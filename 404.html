<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Not found - AiOne LLC</title>
<!-- Served at any path, so every asset and link here is root-absolute. -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Hanken+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  /* deep-blue palette shared with meraqi.ai and the AiOne homepage */
  --ink:#001533;--surface:#04223f;--card:#082c4d;
  --cream:#eef1ec;--cream-pure:#f7f8f4;
  --coral:#ee5a34;--coral-deep:#d8421f;--coral-tint:#f6a085;
  --slate:#95a9bf;
  /* --slate-dim #5e768f was 3.9:1 on the navy background and failed AA for text. Do not use it for text. */
  --slate-dim:#5e768f;
  --line:rgba(238,241,236,0.10);--line-2:rgba(238,241,236,0.20);
  --gold:#d4af37; /* AiOne mark + title rule only */
  --fdisplay:"Bodoni Moda","Didot",Georgia,serif;
  --fbody:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --fmono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--fbody);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--cream);text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--coral)}
a:hover{color:var(--coral-tint)}
::selection{background:var(--coral);color:var(--cream-pure)}
.wrap{max-width:760px;margin:0 auto;padding:0 24px;width:100%}
.masthead{background:var(--ink);border-bottom:1px solid var(--line);padding:20px 0}
.brand{display:flex;align-items:center;gap:14px}
.brand .name{font-family:var(--fdisplay);font-optical-sizing:auto;font-size:23px;font-weight:600;letter-spacing:-0.01em;color:var(--cream-pure);line-height:1.1}
.brand .name span{color:var(--gold)}
.brand .tag{display:block;font-family:var(--fmono);font-size:10px;font-weight:500;letter-spacing:0.32em;color:var(--slate);text-transform:uppercase;margin-top:4px}
main{flex:1 0 auto;display:grid;place-items:center;padding:104px 0}
.nf{text-align:center}
.nf h1{font-family:var(--fdisplay);font-optical-sizing:auto;font-weight:600;font-size:clamp(30px,5vw,44px);line-height:1.1;letter-spacing:-0.015em;color:var(--cream-pure);margin:0 0 24px}
.nf .home{font-family:var(--fbody);font-size:15px;font-weight:600;padding:12px 22px;border-radius:9px;background:var(--coral);color:var(--ink);text-decoration:none;display:inline-block;transition:background .15s}
.nf .home:hover{background:var(--coral-tint);color:var(--ink)}
footer{background:var(--ink);border-top:1px solid var(--line);color:var(--slate);padding:28px 0;font-size:14px}
footer a{color:var(--slate);text-decoration:none;margin-right:18px;transition:color .15s}
footer a:hover{color:var(--cream)}
footer .fine{color:var(--slate);margin-top:12px;font-size:13px;line-height:1.6}
@media(max-width:520px){body{font-size:16px}main{padding:64px 0}}
</style>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <div class="brand">
      <svg width="40" height="40" viewBox="110 80 180 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g transform="translate(200,170)">
          <circle cx="0" cy="0" r="70" stroke="#d4af37" stroke-width="10" fill="none"/>
          <path d="M-40 40 L0 -50 L40 40" stroke="#d4af37" stroke-width="12" fill="none" stroke-linejoin="round"/>
          <line x1="0" y1="-50" x2="0" y2="40" stroke="#d4af37" stroke-width="12"/>
          <circle cx="0" cy="-70" r="9" fill="#fff"/>
        </g>
      </svg>
      <span class="name">Ai<span>One</span> LLC<span class="tag">Intelligent Enterprise</span></span>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="nf">
      <h1>Page not found.</h1>
      <a class="home" href="/">aionellc.com &rarr;</a>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <nav>
      <a href="/">Home</a>
      <a href="/terms">Terms of Service</a>
      <a href="/privacy">Privacy Policy</a>
      <a href="/cookies">Cookie Policy</a>
    </nav>
    <p class="fine">© 2026 AiOne LLC. All rights reserved. Meraqi is a product of AiOne LLC.</p>
  </div>
</footer>
</body>
</html>
